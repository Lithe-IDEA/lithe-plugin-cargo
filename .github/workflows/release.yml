name: Release preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or publish
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest host preview with structured logging
        id: core
        if: hashFiles('scripts/prepare-core.mjs') != ''
        run: node -e 'const s=require("./sdk.lock.json").coreSource; console.log(`repository=${new URL(s.repository).pathname.slice(1)}\nrevision=${s.ref}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.core.outputs.revision != ''
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .artifacts/lithe-core
          sparse-checkout: |
            rust
            shared
          persist-credentials: false
      - name: Verify host prerequisite and build Core bridge
        if: steps.core.outputs.revision != ''
        run: node scripts/prepare-core.mjs
      - name: Verify, test and package
        env:
          LITHE_CARGO_INTEGRATION: '1'
        run: |
          node scripts/verify-sdk.mjs
          if [ -f scripts/test.mjs ]; then
            node scripts/test.mjs
          else
            # Historical tags retain their own test procedure.
            node --test test/*.test.mjs
          fi
          node scripts/package.mjs --expect-tag "$RELEASE_TAG"
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A maintainer may have uploaded an immutable release before this
          # tag run starts. Verify the published bytes without replacing them.
          if gh release view "$RELEASE_TAG" --json url > "$RUNNER_TEMP/existing-release.json"; then
            archive="cargo-build-${RELEASE_TAG#v}-darwin.zip"
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/published"
            (cd "$RUNNER_TEMP/published" && sha256sum --check "$archive.sha256")
            echo "Existing release verified; its assets remain unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          macOS Cargo integration for a Lithe preview with API 3 buildSystems 1, executableResolution 1, settings 2, buildProviders 1, serverProcess 1 and structured plugin diagnostics (litheLogging 1). Stable Lithe 0.6.7 does not offer litheLogging 1 and cannot start this version; keep using 0.1.1 there.

          Changes in 0.1.2:
          - Structured diagnostics: the bundled Node SDK records one INFO for each successful metadata request and one ERROR for each failure on the plugins/io.github.lithe-idea.cargo-build/host channel of Lithe's log window, with duration and a stable failure code. Cargo output, metadata JSON, source and environment values never enter the log. The duplicate raw stderr and JSON error logging is removed.
          - The Cargo path setting becomes the first of the host's ordered executable candidates (executableResolution 1), ahead of PATH discovery. A missing, non-executable or too-old selection still fails instead of falling back.

          Requires Cargo 1.70+ and Node.js 20.3+. Not listed in Lithe Store yet; download the ZIP and install it from disk.

          Preview status: automated integration and contract checks pass; native installation and full UI acceptance are pending. Windows is not supported. Published ZIP bytes must not be replaced.
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --prerelease --title "Cargo $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: |
            .artifacts/test-stability/
            .artifacts/core-target/build.log
          retention-days: 7
