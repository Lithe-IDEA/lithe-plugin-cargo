name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify SDK and run offline integration
        env:
          LITHE_CARGO_INTEGRATION: '1'
        run: |
          mkdir -p .artifacts
          node scripts/verify-sdk.mjs
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.artifacts/tests.xml test/*.test.mjs
      - name: Assemble package
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-plugin
          path: |
            .artifacts/tests.xml
            dist/*.zip
            dist/*.sha256
          retention-days: 7
